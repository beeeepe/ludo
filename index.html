er-radius:13px}.label{font-size:11px;color:#9295a9;margin-bottom:8px}.input-row{display:flex;gap:7px;align-items:center}.input-row input{min-width:0;width:100%;background:#0e1018;border:1px solid #2b2e3e;border-radius:9px;padding:11px 12px;color:white;font-size:14px;outline:none}.input-row input:focus{border-color:#8b69e8}.quick{border:1px solid #33364a;background:#202230;border-radius:8px;padding:8px 9px;color:#c3c5d2;font-size:11px}.primary{border:0;border-radius:10px;padding:12px 16px;font-weight:800;background:linear-gradient(110deg,#a477ff,#7755e8);box-shadow:0 6px 20px #8058df30;transition:transform .15s,filter .15s}.primary:hover{filter:brightness(1.12);transform:translateY(-1px)}.primary:disabled{opacity:.45;cursor:not-allowed;transform:none}.play-btn{width:100%;height:42px;margin-top:4px}.play-btn.cash{background:linear-gradient(110deg,#39d9ae,#1aa883);color:#05251c}.bets-info{display:flex;justify-content:space-between;color:#8a8ea3;font-size:11px;margin-top:14px}.side-card{padding:17px;margin-bottom:15px}.side-title{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:14px}.side-title span:last-child{font-weight:500;font-size:11px;color:#8b8ea2}.history-list{display:grid;gap:8px}.history-item{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;background:#191b27;border-radius:9px;font-size:12px}.history-item strong{font-size:12px}.history-item small{color:#85899d}.win{color:#61d9a4}.lose{color:#ff708e}.online{display:flex;align-items:center;gap:9px;color:#a4a6b7;font-size:12px}.online strong{color:#f3f3fa}.online .dot{margin-left:auto}.game-tag{color:#a28bff;background:#a28bff15;border-radius:6px;padding:4px 7px;font-size:10px;font-weight:800}.tip{font-size:11px;line-height:1.65;color:#85899d}.tip b{color:#c2b0ff}.roulette-layout{display:grid;grid-template-columns:1fr 290px;gap:18px}.wheel-wrap{min-height:325px;display:grid;place-items:center;position:relative}.wheel{width:270px;height:270px;border-radius:50%;position:relative;border:8px solid #cbac6c;box-shadow:0 0 0 5px #322a23,0 0 35px #a7893a30;display:block;overflow:hidden;transition:transform 8s cubic-bezier(.08,.72,.12,1);will-change:transform}.wheel-number{position:absolute;left:50%;top:50%;width:22px;height:22px;display:grid;place-items:center;transform:translate(-50%,-50%);font-size:10px;font-weight:900;color:#fff;text-shadow:0 1px 3px #000;z-index:1}.wheel-number.zero{color:#bfffe0}.wheel-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:66px;height:66px;border-radius:50%;background:radial-gradient(#38303b,#17151b);border:4px solid #b89b61;display:grid;place-items:center;color:#f3d38d;font-size:12px;font-weight:900;box-shadow:0 0 12px #000}.pointer{position:absolute;z-index:4;top:15px;left:calc(50% - 11px);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:28px solid #f0cf7d;filter:drop-shadow(0 2px 3px #000)}.bet-panel{padding:17px;background:#171925;border:1px solid #292c3d;border-radius:13px}.bet-panel h3{font-size:13px;margin:0 0 13px}.bet-options{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:13px 0}.bet-choice{border:1px solid #33364a;background:#202230;border-radius:9px;padding:10px 4px;color:#bfc1ce;font-weight:700;font-size:12px}.bet-choice.selected{border-color:#a177ff;background:#342752;color:white}.bet-choice.red{color:#ff8395}.bet-choice.black{color:#ddd}.bet-choice.green{color:#75dbad}.wheel-result{text-align:center;font-weight:900;font-size:22px;min-height:32px;margin-bottom:8px}.mines-layout{display:grid;grid-template-columns:250px 1fr;gap:20px}.mines-board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-content:center;max-width:420px;margin:auto;width:100%}.mine-cell{aspect-ratio:1;border:1px solid #39344e;border-radius:11px;background:linear-gradient(145deg,#272139,#1d1c2b);font-size:22px;box-shadow:0 4px 0 #12121c;transition:.15s}.mine-cell:hover:not(:disabled){transform:translateY(-2px);border-color:#9471eb;background:#302646}.mine-cell.safe{background:linear-gradient(145deg,#1e705a,#164939);border-color:#43cb9e;box-shadow:0 4px 0 #103428}.mine-cell.mine{background:linear-gradient(145deg,#963a58,#63273b);border-color:#ff7294}.mine-controls .control-box{margin-bottom:11px}.stat-line{display:flex;justify-content:space-between;color:#9a9db0;font-size:12px;margin:12px 0}.stat-line strong{color:#f2f2f8}.mine-note{color:#898da2;font-size:11px;line-height:1.6;margin-top:14px}.slots-machine{max-width:650px;margin:18px auto 0;border:1px solid #473866;background:linear-gradient(145deg,#251d37,#171722);border-radius:22px;padding:25px;box-shadow:0 16px 50px #0005,inset 0 0 35px #a16dff0a}.slot-top{display:flex;justify-content:space-between;align-items:center;color:#c5a9ff;font-size:11px;font-weight:800;letter-spacing:1.5px;margin-bottom:18px}.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px;background:#0d0d14;border:1px solid #42334e;border-radius:15px;box-shadow:inset 0 6px 18px #0008}.reel{height:126px;background:linear-gradient(180deg,#191922,#282333,#191922);border:1px solid #33303d;border-radius:10px;display:grid;place-items:center;font-size:57px;text-shadow:0 5px 13px #0008}.reel.spinning{animation:shake .13s infinite alternate}@keyframes shake{to{transform:translateY(3px);filter:blur(1px)}}.slot-controls{display:flex;gap:12px;align-items:end;margin-top:16px}.slot-controls .control-box{flex:1}.slot-controls .primary{height:44px;min-width:135px}.slot-message{text-align:center;height:25px;margin-top:12px;color:#c2a6ff;font-weight:800}.paytable{max-width:650px;margin:16px auto 0;display:flex;justify-content:center;gap:18px;flex-wrap:wrap;color:#85889b;font-size:11px}.paytable b{color:#e0d2ff}.slot-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:12px;background:#0d0d14;border:1px solid #42334e;border-radius:15px;box-shadow:inset 0 6px 18px #0008}.slot-cell{aspect-ratio:1.15;min-width:0;display:grid;place-items:center;background:linear-gradient(180deg,#1b1923,#30283c,#1a1822);border:1px solid #3c334a;border-radius:11px;font-size:clamp(22px,4vw,38px);text-shadow:0 5px 13px #0008;transition:transform .18s,border-color .18s,box-shadow .18s}.slot-cell.spinning{animation:slotShuffle .13s infinite alternate}.slot-cell.hit{border-color:#f4c96f;box-shadow:inset 0 0 19px #f4c96f44,0 0 10px #ffd77855;transform:scale(1.04)}.slot-cell.scatter-hit{border-color:#75e5cb;box-shadow:inset 0 0 16px #57d9bd55,0 0 8px #57d9bd44}@keyframes slotShuffle{to{transform:translateY(3px);filter:blur(1px);opacity:.75}}.slot-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}.slot-stats>div{padding:9px 11px;background:#171925;border:1px solid #292c3d;border-radius:10px}.slot-stats small{display:block;font-size:9px;color:#9093a8;letter-spacing:.6px}.slot-stats strong{display:block;color:#efe7ff;font-size:13px;margin-top:3px}.slot-message{min-height:30px;height:auto;line-height:1.5}.slot-win-text{color:#65dda7}.paytable{max-width:760px}.paytable span{padding:7px 10px;background:#171925;border:1px solid #292c3d;border-radius:9px}.slot-controls .primary{min-width:150px}.brand{font-size:15px;letter-spacing:1px}.brand span:last-child{color:#9e7bff}

@media(max-width:900px){.layout{grid-template-columns:1fr}.side-column{display:grid;grid-template-columns:1fr 1fr;gap:12px}.nav{margin-left:0;gap:14px}.roulette-layout{grid-template-columns:1fr 260px}.mines-layout{grid-template-columns:1fr}.mine-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mine-controls .control-box{margin:0}.mines-board{max-width:380px}}

<body>
<div class="shell">
<header class="topbar"><div class="brand"><div class="brand-icon">✦</div><div>ЛУДО<span>ПРИКЛЮЧЕНИЯ</span></div></div><nav class="nav"><a href="#games" class="active">Игры</a></nav><div class="top-right"><div class="balance"><small>Баланс</small> &nbsp;<span id="balance">10 000</span> <small>фишек</small></div><div class="avatar">N</div></div></header>
<div class="layout" id="games"><main class="main-card"><div class="game-tabs"><button class="tab active" data-game="crash"><span class="emoji">🚀</span>Краш</button><button class="tab" data-game="roulette"><span class="emoji">🎡</span>Рулетка</button><button class="tab" data-game="mines"><span class="emoji">💎</span>Минер</button><button class="tab" data-game="slots"><span class="emoji">🎰</span>Слоты</button></div><section class="game" id="game"></section></main>
<aside class="side-column"><div class="side-card"><div class="side-title">Последние раунды <span>история</span></div><div class="history-list" id="history"></div></div></aside></div>
<footer class="footer"><span>© 2026 Лудоприключения · Игровой прототип</span><span><strong>18+</strong> · Играйте ответственно. Виртуальные фишки не имеют ценности.</span></footer>
</div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);let balance=10000, current='crash', historyData=[{name:'Краш',value:'2.34×',type:'win'},{name:'Рулетка',value:'17 · Красное',type:'lose'},{name:'Минер',value:'1.82×',type:'win'},{name:'Краш',value:'1.09×',type:'lose'}];let crashTimer=null, crashPlaying=false, crashValue=1, rouletteWheelRotation=0, minesActive=false,minesCount=3,minesSafe=0,minesBet=100, rouletteBet='red', rouletteSpinning=false, slotsSpinning=false;
function money(n){let value=Math.max(0,Math.round(Number(n)*100)/100);return value.toLocaleString('ru-RU',{maximumFractionDigits:2,minimumFractionDigits:Number.isInteger(value)?0:2})};function updateBalance(){$('#balance').textContent=money(balance)}function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}function addHistory(name,value,type){historyData.unshift({name,value,type});historyData=historyData.slice(0,5);renderHistory()}function renderHistory(){$('#history').innerHTML=historyData.map(x=>`<div class="history-item"><span><small>${x.name}</small><br><strong class="${x.type}">${x.value}</strong></span><span class="${x.type}">${x.type==='win'?'▲':'●'}</span></div>`).join('')}
function amountInput(id='betAmount',val=100){return `<div class="input-row"><input id="${id}" type="number" min="1" max="${balance}" value="${val}"><button class="quick" data-half="${id}">½</button><button class="quick" data-double="${id}">2×</button></div>`}
function render(){let html='';if(current==='crash')html=`<div class="game-head"><div><h2>🚀 Краш</h2><p>Забери выигрыш до того, как множитель рухнет. Теоретический RTP ≈67%.</p></div><span class="round-pill">РАУНД #${Math.floor(Math.random()*800+1200)}</span></div><div class="crash-box"><div class="crash-status" id="crashStatus">● ОЖИДАНИЕ СТАВКИ</div><svg class="chart-line" viewBox="0 0 900 250" preserveAspectRatio="none"><defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#a366ff" stop-opacity=".35"/><stop offset="1" stop-color="#a366ff" stop-opacity="0"/></linearGradient></defs><path id="chartFill" d="M0 250 L0 240 L900 240 L900 250Z" fill="url(#fill)"/><path id="chartPath" d="M0 240 L900 240" fill="none" stroke="#b679ff" stroke-width="3"/></svg><div class="multiplier" id="crashMultiplier">1.00<small>×</small></div></div><div class="controls"><div class="control-box"><div class="label">СУММА СТАВКИ</div>${amountInput()}</div><div class="control-box"><div class="label">ДЕЙСТВИЕ</div><button class="primary play-btn" id="crashButton">Запустить раунд</button></div></div><div class="bets-info"><span>Автовывод отключён</span><span>Шанс — случайный</span></div>`;
if(current==='roulette')html=`<div class="game-head"><div><h2>🎡 Европейская рулетка</h2><p>Сделай ставку на цвет и крути колесо. Теоретический RTP ≈67%.</p></div><span class="round-pill">0–36</span></div><div class="roulette-layout"><div class="wheel-wrap"><div class="pointer"></div><div class="wheel" id="wheel"><div class="wheel-center">ЛП</div></div></div><div class="bet-panel"><h3>Выбери ставку</h3><div class="wheel-result" id="wheelResult">—</div><div class="bet-options"><button class="bet-choice red selected" data-choice="red">🔴 Красное</button><button class="bet-choice black" data-choice="black">⚫ Чёрное</button><button class="bet-choice green" data-choice="green">🟢 0</button></div><div class="label">СУММА СТАВКИ</div>${amountInput('rouletteAmount',100)}<button class="primary play-btn" id="spinButton">Крутить</button><div class="bets-info"><span>Красное / чёрное</span><span>Красное ×1,38 · 0 ×24,79</span></div></div></div>`;

if(current==='slots')html=`<div class="game-head"><div><h2>🎰 Лудо-слоты</h2><p>5 барабанов · 3 ряда · 10 линий · RTP ≈67%</p></div><span class="round-pill">WILD · БОНУС</span></div><div class="slots-machine"><div class="slot-top"><span>✦ ЛУДОПРИКЛЮЧЕНИЯ ✦</span><span>10 ЛИНИЙ</span></div><div id="slotGrid" class="slot-grid"></div><div class="slot-stats"><div><small>ТЕОРЕТИЧЕСКИЙ RTP</small><strong>≈67%</strong></div><div><small>БОНУСНЫЕ СПИНЫ</small><strong id="freeSpins">0</strong></div><div><small>ПОСЛЕДНИЙ ВЫИГРЫШ</small><strong id="slotLastWin">—</strong></div></div><div class="slot-controls"><div class="control-box"><div class="label">СУММА СТАВКИ</div>${amountInput('slotAmount',100)}</div><button class="primary" id="slotButton">Крутить ✨</button></div><div class="slot-message" id="slotMessage">⭐ заменяет символы · 🎁 запускает 5 бонусных спинов</div></div><div class="paytable"><span>🍒 <b>×0,30 / 0,76 / 1,83</b></span><span>🍋 <b>×0,30 / 0,61 / 1,52</b></span><span>🍇 <b>×0,46 / 0,91 / 2,28</b></span><span>🔔 <b>×0,61 / 1,22 / 3,04</b></span><span>💎 <b>×0,91 / 2,28 / 5,33</b></span><span>7️⃣ <b>×1,52 / 3,80 / 15,22</b></span><span>🎁 3+ <b>×0,30 / 0,91 / 2,28 + 5 спинов</b></span><span>По линии: 3 / 4 / 5 символов</span></div>`;

const rouletteNumbers=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];

let minesLayout=[];function bindMines(){let count=$('#mineCount');count.onchange=()=>{count.value=Math.max(1,Math.min(24,Math.floor(Number(count.value)||3)));if(!minesActive)initMineBoard()};$('#minesAmount').oninput=updateMinePotential;$('#mineButton').onclick=()=>{if(!minesActive){minesBet=validBet($('#minesAmount'));if(!minesBet)return;minesCount=Math.max(1,Math.min(24,Math.floor(Number($('#mineCount').value)||3)));balance-=minesBet;updateBalance();minesSafe=0;minesLayout=Array(25).fill(false);let placed=0;while(placed<minesCount){let i=Math.floor(Math.random()*25);if(!minesLayout[i]){minesLayout[i]=true;placed++}}minesActive=true;$('#mineButton').textContent='Забрать выигрыш';initMineBoard();updateMinePotential()}else if(minesSafe>0){let multi=mineMulti();balance+=Math.round(minesBet*multi*100)/100;updateBalance();toast('Забрано: '+money(Math.round(minesBet*multi*100)/100)+' фишек');addHistory('Минер',multi.toFixed(2)+'×','win');minesActive=false;$('#mineButton').textContent='Начать игру';initMineBoard()}};initMineBoard();updateMinePotential()}
